# Простой самодостаточный запуск сайта «Стрижеспасатель».
# Не зависит от caddy/nginx и внешней сети services-net.
# Сайт публикуется на 0.0.0.0:8001 (внутри контейнера — 8000).
#
# Запуск:  podman compose up -d --build
# Останов: podman compose down
services:
  app:
    build: .
    container_name: swift_help_app
    restart: always
    ports:
      - "8080:8000"
    volumes:
      - ./data:/app/data
      - ./app/templates:/app/app/templates
      - ./app/static:/app/static
