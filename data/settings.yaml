# ============================================================
#  Настройки сайта-опросника (универсальный конструктор)
#  Отредактируйте этот файл под свою задачу — пересборка не нужна,
#  изменения подхватываются автоматически (файл смонтирован в контейнер).
# ============================================================

# Название сайта: выводится в шапке, в заголовке вкладки браузера
# и используется как подпись/alt для логотипа.
site_name: "Стрижеспасатель"

# Логотип: путь ОТНОСИТЕЛЬНО папки static/ БЕЗ ведущего слэша.
# Свой файл положите, например, в static/img/logo.png и укажите "img/logo.png".
logo: "img/swift.png"

# Заголовок карточки итоговой инструкции (та самая «переменная заголовка»).
# Замените на свой, например: "Рекомендации", "Инструкция по применению".
instruction_title: "Инструкция по уходу за птицей"

# Текст подвала сайта (поддерживается многострочность через |).
footer: |
  Информационный волонтерский проект помощи стрижам. Сайт носит справочный характер
  и не заменяет консультацию ветеринара. Мы не создаем аккаунты, не храним историю
  обращений и не собираем персональные данных пользователей.

# Контакты волонтёров/организации (необязательно).
# Каждый ключ — подпись, значение — ссылка (откроется в новой вкладке).
contacts:
  VK: "https://vk.com/strijhelp"
  Telegram: "https://t.me/strijhelp"
  email: "help@strijhelp.org"

# Заголовки для конкретных инструкций (необязательно).
# Если для статьи задан заголовок — он используется вместо instruction_title.
# Ключ = имя файла статьи без .md (совпадает с "article" в questions.json).
article_titles:
  bleeding: "Помощь при кровотечении"
  emergency: "Экстренный случай"
  wing: "Повреждение крыла"
  weak: "Слабая птица"

# Текст страницы «О проекте» (необязательно).
# Если существует файл data/about.md — приоритет у него; иначе берётся этот текст.
about_text: |
  Этот сайт создан волонтерами для быстрой помощи людям, которые нашли стрижа.
  Пользователь проходит короткий опрос и получает подходящую инструкцию.
