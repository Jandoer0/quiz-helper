{% extends "base.html" %}

{% block content %}
<div class="card">
    <!-- Заголовок карточки инструкции (внешний проект) -->
    <h1 class="intro-title">{{ instruction_title }}</h1>
    <!-- Контент инструкции из Markdown -->
    <div class="markdown-body">
        {{ content | safe }}
    </div>

    {% if contacts %}
    <div class="contacts-box">
        <p>Связаться с волонтерами:</p>
        {% for key, value in contacts.items() %}
        <div class="contact-row">
            <a href="{{ value }}" target="_blank" rel="noopener">{{ key }}: {{ value }}</a>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Кнопки действий группы -->
    <div class="btn-actions">
        <!-- Кнопка КОПИРОВАТЬ -->
        <button id="copyBtn" class="btn btn-copy">
            Скопировать инструкцию
        </button>

        <!-- Кнопка НАЧАТЬ ЗАНОВО -->
        <a href="/" class="btn btn-secondary">Начать заново</a>
    </div>
</div>

<script>
function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
    }
    // Фоллбэк для небезопасных контекстов (http://ip:порт), где Clipboard API недоступен
    return new Promise(function (resolve, reject) {
        try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.top = '-1000px';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            var ok = document.execCommand('copy');
            document.body.removeChild(ta);
            ok ? resolve() : reject();
        } catch (e) {
            reject(e);
        }
    });
}

document.getElementById('copyBtn').addEventListener('click', function() {
    // Заголовок текущей инструкции (карточка, а не шапка сайта)
    var titleEl = document.querySelector('.intro-title');
    var cleanTitle = titleEl ? titleEl.innerText.trim() : "";

    // Текст инструкции из блока markdown-body
    var contentEl = document.querySelector('.markdown-body');
    var instructionText = contentEl ? contentEl.innerText.trim() : "";

    var textToCopy = cleanTitle + "\n\n" + instructionText + "\n\n" + window.location.href;

    var btn = this;
    copyText(textToCopy).then(function () {
        var originalText = btn.innerText;
        btn.innerText = "✅ Скопировано!";
        btn.style.opacity = "0.85";
        setTimeout(function () {
            btn.innerText = originalText;
            btn.style.opacity = "";
        }, 2000);
    }).catch(function () {
        alert("Не удалось скопировать текст автоматически.");
    });
});
</script>

{% endblock %}
